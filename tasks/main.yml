---
- name: install packages
  with_items: "{{ cyrus_packages }}"
  pkgng:
    name: "{{ item.name }}"
  notify:
    - restart cyrus_imapd

- name: configure cyrus
  template:
    src: cyrus.conf.j2
    dest: /usr/local/etc/cyrus.conf
  notify:
    - restart cyrus_imapd

- name: create directory for certificates
  file:
    path: /var/imap/certs
    mode: 0700
    owner: cyrus
    group: cyrus
    recurse: true
    state: directory

- name: ensure fullchain certificate file exists
  file:
    path: /var/imap/certs/fullchain.pem
    mode: 0700
    owner: cyrus
    group: cyrus
    state: touch

- name: ensure private key certificate file exists
  file:
    path: /var/imap/certs/privkey.pem
    mode: 0700
    owner: cyrus
    group: cyrus
    state: touch

- name: install cert updater
  copy:
    src: update_certs.sh
    dest: /usr/local/bin/update_certs.sh
    mode: 0755

- name: convert cert from letsencrypt
  command: /usr/local/bin/update_certs.sh

- name: configure imapd
  template:
    src: imapd.conf.j2
    dest: /usr/local/etc/imapd.conf
  notify:
    - restart cyrus_imapd

- name: enable cyrus imapd
  template:
    src: cyrus_imapd.j2
    dest: /etc/rc.conf.d/cyrus_imapd
  notify:
    - restart cyrus_imapd

- name: create directory for sockets
  file:
    path: /var/imap/socket
    mode: 0700
    owner: cyrus
    group: cyrus
    recurse: true
    state: directory

- name: create directory for emails
  file:
    path: /var/spool/imap
    mode: 0700
    owner: cyrus
    group: cyrus
    state: directory

- name: create directory for sieve scripts
  file:
    path: /var/spool/sieve
    mode: 0700
    owner: cyrus
    group: cyrus
    state: directory

- name: add default sieve filter
  copy:
    src: default
    dest: /var/spool/sieve/default
    owner: cyrus
    group: cyrus
    mode: 0400
